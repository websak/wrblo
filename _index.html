<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRBLO - Site Under Maintenance</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="https:/wrblo.org//favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="https:/wrblo.org//favicon.svg" />
    <link rel="shortcut icon" href="https://wrblo.org/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://wrblo.org/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #d4bc79 0%, #c29f48 100%);
        }
        
        body {
            min-height: 100vh;
            background: #262353;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
        }
        
        .maintenance-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 550px;
            width: 90%;
            padding: 3rem 2.5rem;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
            margin: 0 auto
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .maintenance-logo {
            max-width: 200px;
            height: auto;
            margin: 0 auto 2rem;
            display: block;
        }
        
        h1 {
           font-family: 'Merriweather', serif;
            color: #262353;
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        
        .lead {
            color: #4a4a68;
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        
        .progress {
            height: 8px;
            border-radius: 10px;
            background-color: #e9ecef;
            margin-bottom: 2rem;
            overflow: hidden;
        }
        
        .progress-bar {
            background: var(--primary-gradient);
            animation: loading 2s ease-in-out infinite;
        }
        
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        .footer-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.875rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="maintenance-card">
            <img src="https://wrblo.org/wp-content/uploads/2021/02/WRBLO_logo-removebg-preview.png" alt="WRBLO Logo" class="maintenance-logo">
            
            <h1>We're Under Maintenance</h1>
            
            <p class="lead">
                We're currently performing scheduled maintenance to improve your experience. 
                We'll be back online shortly. Thank you for your patience!
            </p>
            
            <div class="progress">
                <div class="progress-bar" role="progressbar"></div>
            </div>
            
        </div>
        
        <p class="footer-text text-center">
            &copy; 2025 WRBLO. All rights reserved.
        </p>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
